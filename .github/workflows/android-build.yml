name: Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compiler et tester
        run: bash ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain
